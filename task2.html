<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 2 - Bootstrap Forms</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="index.html">Assignment 4</a>
        <div class="navbar-nav">
            <a class="nav-link" href="index.html">Task 0</a>
            <a class="nav-link" href="task1.html">Task 1</a>
            <a class="nav-link active" href="task2.html">Task 2</a>
            <a class="nav-link" href="task3.html">Task 3</a>
            <a class="nav-link" href="task4.html">Task 4</a>
        </div>
    </div>
</nav>

<main class="container form-container">
    <h1>Contact Us</h1>
    <p class="text-muted">We would love to hear from you.</p>

    <form>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="name" class="form-label">Name</label>
                <input type="text" id="name" class="form-control"
                       placeholder="Your name" required>
                <div class="form-text">Enter your full name.</div>
            </div>

            <div class="col-md-6 mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" class="form-control"
                       placeholder="name@example.com" required>
                <div class="form-text">We will use this to contact you.</div>
            </div>
        </div>

        <div class="mb-3">
            <label for="subject" class="form-label">Subject</label>
            <input type="text" id="subject" class="form-control"
                   placeholder="Message subject" required>
        </div>

        <div class="mb-3">
            <label for="message" class="form-label">Message</label>
            <textarea id="message" class="form-control" rows="5"
                      placeholder="Write your message here" required></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Send Message</button>
        <button type="reset" class="btn btn-outline-secondary">Clear</button>
    </form>
</main>
</body>
</html>
