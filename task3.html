<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 3 - Bootstrap Validation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="index.html">Assignment 4</a>
        <div class="navbar-nav">
            <a class="nav-link" href="index.html">Task 0</a>

            <a class="nav-link" href="task2.html">Task 2</a>
            <a class="nav-link active" href="task3.html">Task 3</a>
            <a class="nav-link" href="task4.html">Task 4</a>
        </div>
    </div>
</nav>

<main class="container form-container">
    <h1>Validated Contact Form</h1>

    <form id="validationForm" novalidate>
        <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input type="text" id="name" class="form-control"
                   required minlength="2">
            <div class="invalid-feedback">Name must contain at least 2 characters.</div>
            <div class="valid-feedback">Looks good!</div>
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" id="email" class="form-control" required>
            <div class="invalid-feedback">Please enter a valid email.</div>
            <div class="valid-feedback">Looks good!</div>
        </div>

        <div class="mb-3">
            <label for="message" class="form-label">Message</label>
            <textarea id="message" class="form-control"
                      required minlength="10"></textarea>
            <div class="invalid-feedback">Message must contain at least 10 characters.</div>
            <div class="valid-feedback">Looks good!</div>
        </div>

        <button type="submit" class="btn btn-primary">Submit</button>
        <button type="reset" class="btn btn-secondary">Reset</button>
        <p id="formResult" class="mt-3" aria-live="polite"></p>
    </form>
</main>

<script src="script.js"></script>
</body>
</html>
